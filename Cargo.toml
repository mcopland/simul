[package]
name = "simul"
version = "0.10.0"
edition = "2024"
# Linux's notify-rust needs 1.89; edition 2024's let chains alone need 1.88.
rust-version = "1.89"
description = "tmux plugin that tracks coding agents (Claude Code, Kiro CLI) in a sidebar"
license = "MIT"
repository = "https://github.com/mcopland/simul"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
libc = "0.2.191"
notify = "8.2.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "process", "sync", "time", "macros", "signal"] }
toml = "1.1.8"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.18.2"

[dev-dependencies]
tempfile = "3.27.0"

# Users download the release binary on every update. No panic = "abort": tokio contains a
# panicking daemon task only when panics unwind.
[profile.release]
strip = true
lto = "thin"
