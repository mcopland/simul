name: ci

# Actions are pinned to the same commit SHAs as release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      # The integration tests drive a real tmux server and need tmux 3.3 or newer; the
      # plain-pane test runs zsh, which macOS ships and Ubuntu doesn't.
      - name: Install tmux and zsh
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y tmux zsh
          else
            brew install tmux
          fi
          tmux -V
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Every suite runs even after one fails, so a single run shows all failures.
      - run: cargo test --no-fail-fast
