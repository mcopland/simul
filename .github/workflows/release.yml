name: release

# Tags publish a GitHub release; manual runs only build, so the pipeline can be
# checked without publishing anything. Actions are pinned to commit SHAs because
# their output ships as binaries whose checksums this same workflow produces.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag, VERSION, and Cargo.toml agree
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$version" != "$cargo_version" ]; then
            echo "VERSION ($version) does not match Cargo.toml ($cargo_version)" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION v$version" >&2
            exit 1
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            runnable: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            runnable: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            runnable: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
            runnable: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: matrix.cross
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cross
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          CROSS: ${{ matrix.cross }}
        run: |
          if [ "$CROSS" = true ]; then
            cross build --release --locked --target "$TARGET"
          else
            cargo build --release --locked --target "$TARGET"
          fi
      - name: Run the binary
        if: matrix.runnable
        run: target/${{ matrix.target }}/release/simul --version
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          stage=$(mktemp -d)
          cp "target/$TARGET/release/simul" LICENSE "$stage/"
          archive="simul-$TARGET.tar.gz"
          mkdir -p dist
          tar -czf "dist/$archive" -C "$stage" simul LICENSE
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: simul-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
